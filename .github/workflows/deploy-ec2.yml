name: Deploy OAKCRED to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'ml/**'
      - 'data/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/oakcred
            git pull origin main
            
            # Disk Management: Resize filesystem to use the new 20GB space (Amazon Linux 2023)
            sudo xfs_growfs / || sudo resize2fs / || true
            df -h
            
            # Cleanup: Free up disk space before installing heavy ML libraries
            sudo dnf clean all || sudo apt-get clean || true
            pip cache purge || true
            
            # Setup/Update Virtual Environment
            if [ ! -d "venv" ] || [ ! -f "venv/bin/python" ]; then
                python3 -m venv venv
            fi
            
            source venv/bin/activate
            # Use --no-cache-dir to save memory/disk during installation
            pip install --no-cache-dir -r requirements.txt
            
            # Deployment: Direct Uvicorn launch
            pkill -f uvicorn || true
            nohup venv/bin/uvicorn --host 0.0.0.0 --port 8000 --app-dir backend main:app > server.log 2>&1 &
            
            echo "Deployment Complete. Access at http://${{ secrets.EC2_HOST }}:8000"
