name: Deploy OAKCRED to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'ml/**'
      - 'data/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/oakcred
            git pull origin main
            
            # Disk Management: Force partition and filesystem growth
            sudo growpart /dev/nvme0n1 1 || true
            sudo xfs_growfs / || sudo resize2fs / || true
            
            # CRITICAL FIX: Relocate TMPDIR to the main partition (which has 6GB free)
            # This prevents pip from crashing on the tiny 400MB /tmp mount.
            mkdir -p ~/oakcred/tmp
            export TMPDIR=~/oakcred/tmp
            
            # Cleanup: Deep purge caches
            sudo dnf clean all || sudo apt-get clean || true
            pip cache purge || true
            rm -rf ~/oakcred/tmp/*
            
            # Setup/Update Virtual Environment
            if [ ! -d "venv" ] || [ ! -f "venv/bin/python" ]; then
                python3 -m venv venv
            fi
            
            source venv/bin/activate
            # Install with relocated TMPDIR and no-cache-dir
            pip install --no-cache-dir -r requirements.txt
            
            # Deployment: Systemd Service Integration
            # 1. Update the service unit file
            sudo cp scripts/oakcred.service /etc/systemd/system/oakcred.service
            sudo systemctl daemon-reload
            
            # 2. Enable and Restart the service
            sudo systemctl enable oakcred
            sudo systemctl restart oakcred
            
            # 3. Final Verification check
            sleep 5
            sudo systemctl status oakcred --no-pager
            
            echo "Deployment Complete. Sovereign AI Live at http://${{ secrets.EC2_HOST }}:8000"
