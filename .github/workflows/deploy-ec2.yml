name: Deploy OAKCRED to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'ml/**'
      - 'data/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/oakcred
            git pull origin main
            
            # Setup/Update Virtual Environment
            if [ ! -d "venv" ] || [ ! -f "venv/bin/python" ]; then
                python3 -m venv venv
            fi
            
            source venv/bin/activate
            # Use --no-cache-dir to save memory during pip install on micro instances
            pip install --no-cache-dir -r requirements.txt
            
            # Deployment: Direct Uvicorn launch (reliable fallback for micro instances)
            # Kill existing uvicorn process and restart
            pkill -f uvicorn || true
            nohup venv/bin/uvicorn --host 0.0.0.0 --port 8000 --app-dir backend main:app > server.log 2>&1 &
            
            echo "Deployment Complete. Access at http://${{ secrets.EC2_HOST }}:8000"
